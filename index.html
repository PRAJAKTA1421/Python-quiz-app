<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Time</title>
    <link rel="stylesheet" href="style.css">

    <!-- THREE.JS (Required) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

    <!-- VANTA.NET -->
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
</head>
<body>

<!-- 🔥 Animated Background -->
<div id="vanta-bg"></div>

<!-- QUIZ CONTENT -->
<div class="quiz-container">
    <h1 class="title">
        <span>QUIZ</span> <span class="yellow">TIME</span>
    </h1>

    <div class="card">
        <p id="question"></p>
    </div>

    <div class="options">
        <button class="option" onclick="selectAnswer(this)"></button>
        <button class="option" onclick="selectAnswer(this)"></button>
        <button class="option" onclick="selectAnswer(this)"></button>
        <button class="option" onclick="selectAnswer(this)"></button>
    </div>

    <button id="submitBtn" onclick="submitAnswer()">Submit</button>
    <p id="feedback"></p>
</div>

<script src="script.js"></script>

<!-- VANTA INIT -->
<script>
VANTA.NET({
  el: "#vanta-bg",
  mouseControls: true,
  touchControls: true,
  gyroControls: false,
  color: 0xff3f81,
  backgroundColor: 0x0f172a,
  points: 10.0,
  maxDistance: 20.0,
  spacing: 15.0
})
</script>

</body>
</html>
